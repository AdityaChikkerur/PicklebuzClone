<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickleBuzz</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
      }
      .card {
        max-width: 22rem;
        text-align: center;
        line-height: 1.55;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
        color: #f8fafc;
      }
      p {
        margin: 0 0 0.75rem;
        color: #94a3b8;
        font-size: 0.9rem;
      }
      code {
        display: block;
        margin: 0.75rem 0;
        padding: 0.65rem 0.75rem;
        border-radius: 0.5rem;
        background: #1e293b;
        color: #86efac;
        font-size: 0.75rem;
        word-break: break-all;
        text-align: left;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        margin: 0 auto 1rem;
        border: 3px solid #334155;
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="content">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Connecting to PickleBuzz…</h1>
      <p id="status">Checking server configuration.</p>
    </div>
    <script>
      (function () {
        var status = document.getElementById("status");
        var content = document.getElementById("content");

        function showSetupHelp() {
          content.innerHTML =
            "<h1>Server not configured</h1>" +
            "<p>This APK needs a running PickleBuzz server. Rebuild with:</p>" +
            "<code>CAPACITOR_SERVER_URL=https://your-app.vercel.app</code>" +
            "<p>For Wi‑Fi testing, use your PC IP and run <strong>npm run start:mobile</strong> on the same network.</p>";
        }

        fetch("./capacitor-server.json", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("missing");
            return res.json();
          })
          .then(function (cfg) {
            if (cfg && cfg.url) {
              status.textContent = "Redirecting…";
              window.location.replace(cfg.url);
              return;
            }
            showSetupHelp();
          })
          .catch(showSetupHelp);
      })();
    </script>
  </body>
</html>
